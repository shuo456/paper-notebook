<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>论文详情 · Shuo Xu 的论文笔记</title>
  <meta name="description" content="论文摘要、个人笔记与深度阅读记录。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
  <script>(function(){var t=localStorage.getItem('pn-theme')||'light';document.documentElement.setAttribute('data-theme',t)})();</script>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo" aria-label="返回论文列表">
        <span class="logo-icon" aria-hidden="true">📚</span>
        <span><span class="logo-text" id="site-title">论文笔记</span><span class="logo-sub" id="site-owner">Shuo Xu</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">论文库</a></li>
        <li><a id="github-link" href="https://github.com/shuo456/paper-notebook" target="_blank" rel="noopener">GitHub</a></li>
        <li><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深色模式"><span class="toggle-icon">🌙</span><span class="toggle-label">深色</span></button></li>
      </ul>
    </div>
  </nav>

  <main id="detail-main">
    <header class="paper-hero">
      <div class="container">
        <a href="index.html" class="back-link">← 返回全部论文</a>
        <div id="paper-color-bar" style="height:3px;border-radius:2px;margin:24px 0 20px;max-width:200px;background:linear-gradient(90deg,var(--accent),transparent)"></div>
        <div class="paper-meta-row">
          <span id="paper-venue" class="venue-badge"></span>
          <span id="paper-year" class="card-year"></span>
          <span id="paper-stars" class="star-rating"></span>
        </div>
        <h1 class="paper-title" id="paper-title">正在加载…</h1>
        <p class="paper-authors" id="paper-authors"></p>
        <div class="paper-links">
          <a id="btn-source" class="btn btn-primary" target="_blank" rel="noopener noreferrer" hidden>打开论文 ↗</a>
          <a id="btn-pdf" class="btn btn-outline" target="_blank" rel="noopener noreferrer" hidden>PDF ↗</a>
          <a id="btn-doi" class="btn btn-outline" target="_blank" rel="noopener noreferrer" hidden>DOI ↗</a>
          <button id="btn-read-toggle" class="btn btn-outline" type="button">标为已读</button>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="paper-content">
        <div class="content-main">
          <section class="section-card"><div class="section-label">摘要</div><p class="abstract-text" id="paper-abstract"></p></section>
          <section class="section-card"><div class="section-label">我的笔记</div><div class="notes-content" id="paper-notes"></div></section>
          <section class="section-card section-nlm" id="section-nlm" hidden>
            <div class="section-label">📓 NotebookLM 深度笔记 <a id="nlm-open-link" class="nlm-link-out" target="_blank" rel="noopener noreferrer" hidden>在 NotebookLM 中打开 ↗</a></div>
            <div class="notes-content" id="paper-nlm-notes"></div>
          </section>
        </div>
        <aside class="content-side">
          <section class="section-card">
            <div class="section-label">论文信息</div>
            <div class="info-row"><span class="info-key">出处</span><span class="info-val" id="info-venue"></span></div>
            <div class="info-row"><span class="info-key">年份</span><span class="info-val" id="info-year"></span></div>
            <div class="info-row"><span class="info-key">评分</span><span class="info-val" id="info-rating"></span></div>
            <div class="info-row"><span class="info-key">DOI</span><span class="info-val" id="info-doi"></span></div>
            <div class="info-row"><span class="info-key">收录日期</span><span class="info-val" id="info-added"></span></div>
            <div class="info-row"><span class="info-key">来源</span><span class="info-val" id="info-source"></span></div>
          </section>
          <section class="section-card"><div class="section-label">标签</div><div class="tags-cloud" id="paper-tags"></div></section>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container"><p>由 <a href="https://github.com/shuo456" target="_blank" rel="noopener">Shuo Xu</a> 维护 · 纯静态 GitHub Pages</p></div></footer>
  <script src="js/theme.js"></script>
  <script type="module" src="js/paper.js"></script>
</body>
</html>
